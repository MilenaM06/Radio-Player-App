<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>Radio Player App</title>
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <script type="module" src="https://unpkg.com/@ionic/pwa-elements@latest/dist/ionicpwaelements/ionicpwaelements.esm.js"></script>
    <script nomodule src="https://unpkg.com/@ionic/pwa-elements@latest/dist/ionicpwaelements/ionicpwaelements.js"></script>

    <link rel="icon" type="image/x-icon" href="./assets/icon/favicon.ico" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./css/style.css" />
    <meta name="theme-color" content="#31d53d" />

  </head>
  <body class="min-h-screen flex items-start justify-center py-16 px-6 font-sans text-gray-100 selection:bg-blue-600 selection:text-white">
    
    <main class="container max-w-7xl mx-auto space-y-12">

      <header class="text-center max-w-2xl mx-auto">
        <h1 class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-500 to-indigo-600 drop-shadow-lg mb-4">
          🎧 Radio Player
        </h1>
      </header>

      <section class="text-center">
        <h2 id="nowPlaying" class="text-xl sm:text-2xl md:text-3xl font-semibold text-blue-400 mb-8 drop-shadow-md">
          Now Playing: None
        </h2>
        <audio id="radioPlayer" controls autoplay 
              class="mx-auto w-full max-w-3xl"
              preload="auto">
        </audio>
      </section>

      <section class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-8 max-w-7xl mx-auto">
        
       <div class="card rounded-full shadow-2xl cursor-pointer transform transition duration-300 hover:scale-105 hover:shadow-[0_0_30px_10px_rgba(150,200,210,0.8)]">
          <img
            src="assets/imgs/radio-s1.png"
            alt="Radio S1"
            data-url="https://stream.radios.rs:9000/;*.mp3"
            class="w-full h-full object-cover rounded-full"
          />
        </div>

       <div class="card rounded-full shadow-2xl cursor-pointer transform transition duration-300 hover:scale-105 hover:shadow-[0_0_30px_10px_rgba(150,200,210,0.8)]">
